name: Test
run-name: "#${{ github.run_number }} test by ${{ github.triggering_actor }}"
on:
  pull_request:
    paths:
      - "testit-js-commons/**"
      - "testit-adapter-codecept/**"
      - "testit-adapter-cucumber/**"
      - "testit-adapter-jest/**"
      - "testit-adapter-mocha/**"
      - "testit-adapter-playwright/**"
      - "testit-adapter-cypress/**"
      - ".github/**/test.yml"

  workflow_dispatch:
env:
  DOTNET_VERSION: 8
  GITHUB_PAT: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
  NODE_VERSION: 21
  PYTHON_VERSION: 3.12
  TEMP_FILE: tmp/output.txt
  FILTER_FILE: tmp/filter.txt
  TMS_ADAPTER_MODE: 1
  TMS_CERT_VALIDATION: false
  TMS_OVERWRITE_EXPECTED: false
  TMS_IS_CI: true
  TMS_PRIVATE_TOKEN: ${{ secrets.TESTIT_PRIVATE_TOKEN }}
  TMS_URL: ${{ secrets.TESTIT_URL }}
  LOG_LEVEL: debug
jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check run-e2e label or workflow_dispatch
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  test:
    name: ${{ matrix.project_name }}
    needs: check-label
    if: needs.check-label.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter_name: testit-adapter-codecept
            configuration_id: CODECEPT_CONFIGURATION_ID
            project_id: CODECEPT_PROJECT_ID
            project_name: codecept
            filter_framework: codeceptjs
            supports_mode0: false
            supports_filter: true
          - adapter_name: testit-adapter-cucumber
            configuration_id: CUCUMBER_CONFIGURATION_ID
            project_id: CUCUMBER_PROJECT_ID
            project_name: cucumber
            filter_framework: cucumberjs
            supports_mode0: true
            supports_filter: true
          - adapter_name: testit-adapter-jest
            configuration_id: JEST_CONFIGURATION_ID
            project_id: JEST_PROJECT_ID
            project_name: jest
            filter_framework: jest
            supports_mode0: false
            supports_filter: true
          - adapter_name: testit-adapter-mocha
            configuration_id: MOCHA_CONFIGURATION_ID
            project_id: MOCHA_PROJECT_ID
            project_name: mocha
            filter_framework: mocha
            supports_mode0: false
            supports_filter: true
          - adapter_name: testit-adapter-playwright
            configuration_id: PLAYWRIGHT_CONFIGURATION_ID
            project_id: PLAYWRIGHT_PROJECT_ID
            project_name: playwright
            filter_framework: playwright
            supports_mode0: false
            supports_filter: true
          - adapter_name: testit-adapter-cypress
            configuration_id: CYPRESS_CONFIGURATION_ID
            project_id: CYPRESS_PROJECT_ID
            project_name: cypress
            filter_framework: cypress
            supports_mode0: false
            # Skip filter: no explicit externalId in examples; @cypress/grep not wired in cypress.config.js
            supports_filter: false
          - adapter_name: testcafe-reporter-testit
            configuration_id: TESTCAFE_CONFIGURATION_ID
            project_id: TESTCAFE_PROJECT_ID
            project_name: testcafe
            filter_framework: testcafe
            supports_mode0: false
            # No FilterFactory entry for testcafe
            supports_filter: false
    env:
      TMS_CONFIGURATION_ID: ${{ secrets[matrix.configuration_id] }}
      TMS_PROJECT_ID: ${{ secrets[matrix.project_id] }}
      TMS_TEST_RUN_NAME: ${{ matrix.project_name }} TestRun
      TMS_IMPORT_REALTIME: true
      TMS_ADAPTER_MODE: 1
      TMS_SYNC_STORAGE_PORT: 49153
      TMS_DEBUG_SYNC_STORAGE: 1
      SUBSET_IDS_FILE: api-validator-dotnet/ci/mode0/${{ matrix.project_name }}/external-ids.txt
      #TMS_DEBUG_LOAD_TEST_RUN: 1
    steps:
      - name: Checkout adapters-js
        uses: actions/checkout@v6
      - name: Checkout api-validator-dotnet
        uses: actions/checkout@v6
        with:
          repository: testit-tms/api-validator-dotnet
          token: ${{ env.GITHUB_PAT }}
          ref: feat/TMS-38946   # temporary; drop after merge to main
          path: api-validator-dotnet
      - name: Checkout testit-cli
        uses: actions/checkout@v6
        with:
          repository: testit-tms/testit-cli
          token: ${{ env.GITHUB_PAT }}
          ref: fix/autotests-filter-project-scope   # temporary; drop after merge/PyPI
          path: testit-cli
      - name: Checkout js-examples
        uses: actions/checkout@v6
        with:
          repository: testit-tms/js-examples
          ref: examples_for_tests
          path: js-examples
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup environment
        run: |
        
          cd ${{ matrix.adapter_name }}
          npm run build && npm link

          # Copy built packages to examples directory node_modules
          cd ../js-examples/${{ matrix.project_name }}
          npm i

          # Copy testit-api-client
          # rm -rf node_modules/testit-api-client
          # cp -r ../../testit-js-commons/node_modules/testit-api-client node_modules/testit-api-client

          # Copy testit-js-commons
          cp -r ../../testit-js-commons/lib node_modules/testit-js-commons/

          # Copy the specific adapter
          # Handle different output directories for different adapters
          if [ "${{ matrix.adapter_name }}" = "testit-adapter-mocha" ] || [ "${{ matrix.adapter_name }}" = "testcafe-reporter-testit" ]; then
            cp -r ../../${{ matrix.adapter_name }}/lib node_modules/${{ matrix.adapter_name }}
          elif [ "${{ matrix.adapter_name }}" = "testit-adapter-codecept" ]; then
            cp -r ../../${{ matrix.adapter_name }}/build node_modules/${{ matrix.adapter_name }}
          else
            cp -r ../../${{ matrix.adapter_name }}/dist node_modules/${{ matrix.adapter_name }}
          fi

          # Playwright browsers only for codecept / testcafe examples
          if [ "${{ matrix.project_name }}" = "codecept" ] || [ "${{ matrix.project_name }}" = "testcafe" ]; then
            npx playwright install --with-deps chromium
          fi
          cd ../..

          dotnet build --configuration Debug --property WarningLevel=0 api-validator-dotnet
          pip install ./testit-cli

      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}

          # mkdir -p "$(dirname "${{ env.TEMP_FILE }}")"
          # BASE_URL="${{ env.TMS_URL }}"
          # BASE_URL="${BASE_URL%/}"
          # BODY=$(jq -nc \
          #   --arg projectId "${{ env.TMS_PROJECT_ID }}" \
          #   --arg name "${{ env.TMS_TEST_RUN_NAME }}" \
          #   '{projectId: $projectId, name: $name}')
          
          # curl -sS -f -X POST "${BASE_URL}/api/v2/testRuns" \
          #   -H "accept: application/json" \
          #   -H "Content-Type: application/json" \
          #   -H "Authorization: PrivateToken ${{ env.TMS_PRIVATE_TOKEN }}" \
          #   -d "$BODY" \
          #   | jq -er '.id' > "${{ env.TEMP_FILE }}"

          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> .env
          export TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})
          echo "{{ $(cat .env) }}"
          echo "${{ env.TMS_TEST_RUN_ID }}"
          echo "${{ env.TMS_URL }}"
          echo "${{ env.TMS_ADAPTER_MODE }}"
          echo "$GITHUB_ENV"

      - name: Test
        run: |

          chmod +x ./scripts/get_sync_storage.sh
          chmod +x ./scripts/wait_sync_storage_health.sh

          export SYNC_STORAGE_VERSION=$(grep -o 'VERSION = "[^"]*"' testit-js-commons/src/services/syncstorage/syncstorage.runner.ts | cut -d'"' -f2)
         

          cd js-examples/${{ matrix.project_name }}
          
          # start sync storage before all other processes
          ../../scripts/get_sync_storage.sh $SYNC_STORAGE_VERSION
          pkill -f 'syncstorage-linux-amd64.*--port ${{ env.TMS_SYNC_STORAGE_PORT }}' 2>/dev/null || true
          sleep 1
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port ${{ env.TMS_SYNC_STORAGE_PORT }} \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 &
          ../../scripts/wait_sync_storage_health.sh ${{ env.TMS_SYNC_STORAGE_PORT }} service.log
          
          if [ "${{ matrix.project_name }}" = "testcafe" ]; then
            npx testcafe "chrome:headless --disable-search-engine-choice-screen --no-sandbox" tests/ -r testit --disable-native-automation || true
          else
            export HEADLESS=true
            npm run test || true
          fi

          # sleep 10
          curl -v http://127.0.0.1:${{ env.TMS_SYNC_STORAGE_PORT }}/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} || true
          cat service.log

      - name: Validate
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet


      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}

          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> .env
          export TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})
          echo "{{ $(cat .env) }}"
          echo "${{ env.TMS_TEST_RUN_ID }}"
          echo "${{ env.TMS_URL }}"
          echo "${{ env.TMS_ADAPTER_MODE }}"
          echo "$GITHUB_ENV"

      - name: Test import realtime false
        run: |
          export TMS_IMPORT_REALTIME=false

          chmod +x ./scripts/get_sync_storage.sh
          chmod +x ./scripts/wait_sync_storage_health.sh

          export SYNC_STORAGE_VERSION=$(grep -o 'VERSION = "[^"]*"' testit-js-commons/src/services/syncstorage/syncstorage.runner.ts | cut -d'"' -f2)
         

          cd js-examples/${{ matrix.project_name }}
          
          # start sync storage before all other processes
          ../../scripts/get_sync_storage.sh $SYNC_STORAGE_VERSION
          pkill -f 'syncstorage-linux-amd64.*--port ${{ env.TMS_SYNC_STORAGE_PORT }}' 2>/dev/null || true
          sleep 1
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port ${{ env.TMS_SYNC_STORAGE_PORT }} \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service2.log 2>&1 &
          ../../scripts/wait_sync_storage_health.sh ${{ env.TMS_SYNC_STORAGE_PORT }} service2.log
          
          if [ "${{ matrix.project_name }}" = "testcafe" ]; then
            npx testcafe "chrome:headless --disable-search-engine-choice-screen --no-sandbox" tests/ -r testit --disable-native-automation || true
          else
            export HEADLESS=true
            npm run test || true
          fi

          # sleep 10
          curl -v http://127.0.0.1:${{ env.TMS_SYNC_STORAGE_PORT }}/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} || true
          cat service2.log

      - name: Validate import realtime false
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet


      - name: Test Adapter Mode 2
        run: |

          export TMS_ADAPTER_MODE=2

          cd js-examples/${{ matrix.project_name }}
          
          if [ "${{ matrix.project_name }}" = "testcafe" ]; then
            npx testcafe "chrome:headless --disable-search-engine-choice-screen --no-sandbox" tests/ -r testit --disable-native-automation || true
          else
            npm run test || true
          fi

          # sleep 10
          curl -v http://127.0.0.1:${{ env.TMS_SYNC_STORAGE_PORT }}/wait-completion || true
          # cat service.log

      - name: Validate Again
        run: |
          export TMS_TEST_RUN_ID=skip
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      # --- Mode 0: full suite, adapter filters by filled test run ---
      - name: Create filled TestRun Mode 0
        if: matrix.supports_mode0
        run: |
          pip install ./testit-cli
          mkdir -p tmp
          testit testrun create launch \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --project-id "${{ env.TMS_PROJECT_ID }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --autotest-external-ids-file "${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}" \
            --testrun-name "${{ matrix.project_name }} Mode0" \
            --output "${{ env.TEMP_FILE }}"
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test Adapter Mode 0
        if: matrix.supports_mode0
        run: |
          export TMS_ADAPTER_MODE=0

          chmod +x ./scripts/get_sync_storage.sh
          chmod +x ./scripts/wait_sync_storage_health.sh
          export SYNC_STORAGE_VERSION=$(grep -o 'VERSION = "[^"]*"' testit-js-commons/src/services/syncstorage/syncstorage.runner.ts | cut -d'"' -f2)

          cd js-examples/${{ matrix.project_name }}

          ../../scripts/get_sync_storage.sh $SYNC_STORAGE_VERSION
          pkill -f 'syncstorage-linux-amd64.*--port ${{ env.TMS_SYNC_STORAGE_PORT }}' 2>/dev/null || true
          sleep 1
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port ${{ env.TMS_SYNC_STORAGE_PORT }} \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 &
          ../../scripts/wait_sync_storage_health.sh ${{ env.TMS_SYNC_STORAGE_PORT }} service.log

          # Full suite — adapter keeps only tests present in the filled run
          export HEADLESS=true
          npm run test || true

          curl -v http://127.0.0.1:${{ env.TMS_SYNC_STORAGE_PORT }}/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} || true
          cat service.log

      - name: Validate Mode 0
        if: matrix.supports_mode0
        run: |
          export TMS_EXPECTED_EXTERNAL_IDS_FILE="${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}"
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      # --- autotests_filter + mode 1: framework runs only subset ---
      - name: Create filled TestRun Filter
        if: matrix.supports_filter
        run: |
          pip install ./testit-cli
          mkdir -p tmp
          testit testrun create launch \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --project-id "${{ env.TMS_PROJECT_ID }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --autotest-external-ids-file "${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}" \
            --testrun-name "${{ matrix.project_name }} Filter" \
            --output "${{ env.TEMP_FILE }}"
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
          testit autotests_filter \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --testrun-id "$(<${{ env.TEMP_FILE }})" \
            --framework "${{ matrix.filter_framework }}" \
            --output "${{ env.FILTER_FILE }}"
          echo "Filter file:" && cat "${{ env.FILTER_FILE }}"

      - name: Test with autotests_filter
        if: matrix.supports_filter
        run: |
          export TMS_ADAPTER_MODE=1

          chmod +x ./scripts/get_sync_storage.sh
          chmod +x ./scripts/wait_sync_storage_health.sh
          export SYNC_STORAGE_VERSION=$(grep -o 'VERSION = "[^"]*"' testit-js-commons/src/services/syncstorage/syncstorage.runner.ts | cut -d'"' -f2)

          cd js-examples/${{ matrix.project_name }}

          ../../scripts/get_sync_storage.sh $SYNC_STORAGE_VERSION
          pkill -f 'syncstorage-linux-amd64.*--port ${{ env.TMS_SYNC_STORAGE_PORT }}' 2>/dev/null || true
          sleep 1
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port ${{ env.TMS_SYNC_STORAGE_PORT }} \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 &
          ../../scripts/wait_sync_storage_health.sh ${{ env.TMS_SYNC_STORAGE_PORT }} service.log

          FILTER="$(cat ../../${{ env.FILTER_FILE }})"
          export HEADLESS=true
          case "${{ matrix.filter_framework }}" in
            jest)
              npx jest -t "$FILTER" || true
              ;;
            playwright)
              npx playwright test --grep "$FILTER" || true
              ;;
            mocha)
              npx mocha --grep "$FILTER" || true
              ;;
            codeceptjs)
              npx codeceptjs run --grep "$FILTER" || true
              ;;
            cucumberjs)
              npx cucumber-js --name "$FILTER" || true
              ;;
            *)
              echo "Unknown filter_framework: ${{ matrix.filter_framework }}" >&2
              exit 1
              ;;
          esac

          curl -v http://127.0.0.1:${{ env.TMS_SYNC_STORAGE_PORT }}/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }} || true
          cat service.log

      - name: Validate Filter
        if: matrix.supports_filter
        run: |
          export TMS_EXPECTED_EXTERNAL_IDS_FILE="${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}"
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet
